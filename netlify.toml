# Static site — no framework, no bundler. The build step just assembles the
# public files into _site/ so repo-only files (scripts, docs) are not served.

[build]
  command = "bash scripts/build_site.sh"
  ignore = "bash scripts/netlify_ignore.sh"
  publish = "_site"

[[redirects]]
  from = "/"
  to = "/recent-game/"
  status = 302
  force = true

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# The Globe feed is polled while its tab is open. Revalidate it so a newly
# deployed headline list is not hidden behind the general five-minute cache.
[[headers]]
  for = "/data/globe.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/herald.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/x-posts.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/schedule.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/recent-game.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/standings.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/pitching.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The project atlas is rebuilt weekly; always serve the latest copy.
[[headers]]
  for = "/atlas/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Story pages and their code are small, and stale modules can render a newer data
# shape incorrectly after a deploy. Always fetch the current release.
[[headers]]
  for = "/stories/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Beta availability must never use the general five-minute static-data cache.
[[headers]]
  for = "/data/releases/testflight-v1.json"
  [headers.values]
    Cache-Control = "no-store"

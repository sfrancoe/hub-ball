name: Refresh playoff statistics

on:
  schedule:
    # The field can change on the season's final day; postseason totals change during October.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Behave like a scheduled run (skip outside the postseason window)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: site-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh roster-scoped postseason stats
        env:
          SCHEDULED_INPUT: ${{ inputs.scheduled }}
        run: |
          scheduled=()
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$SCHEDULED_INPUT" == "true" ]]; then scheduled+=(--scheduled); fi
          python3 scripts/fetch_playoff_history.py --season 2026 "${scheduled[@]}"
      - name: Verify postseason stat parsing
        run: python3 scripts/test_playoff_history.py
      - name: Commit only when the snapshot changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/postseason-history/2026-v2.json; then
            echo "No playoff-history changes."
          else
            git add data/postseason-history/2026-v2.json
            git commit -m "Refresh playoff statistics ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin main
            git push
          fi
